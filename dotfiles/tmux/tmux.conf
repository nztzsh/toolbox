# tmux config — Cmd-as-iTerm-native-prefixless map
# Each shortcut: iTerm sends an escape sequence (set in iTerm Key Mappings),
# tmux receives it as a user-key (Useri) and runs the bound action.
#
# Escape-seq scheme: ESC [ 5NNN ~  (5001..5099 reserved here)
# iTerm "Send Escape Sequence" input strips the leading ESC, so paste
# the bracket-onward portion shown in the README/setup notes.

# --- Base settings ----------------------------------------------------------
set -g pane-border-format "#{pane_index} #{pane_title}"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -sg escape-time 10
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"

# --- User-key declarations (must match iTerm escape sequences) -------------
# Window control
set -s user-keys[0]  "\e[5001~"   # Cmd-T            new window
set -s user-keys[1]  "\e[5002~"   # Cmd-W            kill window (confirm)
set -s user-keys[2]  "\e[5003~"   # Cmd-N            new session

# Window select 1..9
set -s user-keys[10] "\e[5010~"
set -s user-keys[11] "\e[5011~"
set -s user-keys[12] "\e[5012~"
set -s user-keys[13] "\e[5013~"
set -s user-keys[14] "\e[5014~"
set -s user-keys[15] "\e[5015~"
set -s user-keys[16] "\e[5016~"
set -s user-keys[17] "\e[5017~"
set -s user-keys[18] "\e[5018~"

# Window nav
set -s user-keys[20] "\e[5020~"   # Cmd-Shift-]      next window
set -s user-keys[21] "\e[5021~"   # Cmd-Shift-[      prev window

# Pane split
set -s user-keys[30] "\e[5030~"   # Cmd-D            split right (vertical)
set -s user-keys[31] "\e[5031~"   # Cmd-Shift-D      split down (horizontal)

# Pane nav
set -s user-keys[40] "\e[5040~"   # Cmd-Opt-Left
set -s user-keys[41] "\e[5041~"   # Cmd-Opt-Right
set -s user-keys[42] "\e[5042~"   # Cmd-Opt-Up
set -s user-keys[43] "\e[5043~"   # Cmd-Opt-Down

# Misc
set -s user-keys[50] "\e[5050~"   # Cmd-Enter        zoom toggle
set -s user-keys[60] "\e[5060~"   # Cmd-,            rename window
set -s user-keys[70] "\e[5070~"   # Cmd-K            clear screen + history

# --- Bindings (no prefix, direct) ------------------------------------------
bind-key -n User0  new-window -c "#{pane_current_path}"
bind-key -n User1  confirm-before -p "kill window #W? (y/n)" kill-window
bind-key -n User2  new-session

bind-key -n User10 select-window -t :1
bind-key -n User11 select-window -t :2
bind-key -n User12 select-window -t :3
bind-key -n User13 select-window -t :4
bind-key -n User14 select-window -t :5
bind-key -n User15 select-window -t :6
bind-key -n User16 select-window -t :7
bind-key -n User17 select-window -t :8
bind-key -n User18 select-window -t :9

bind-key -n User20 next-window
bind-key -n User21 previous-window

bind-key -n User30 split-window -h -c "#{pane_current_path}"
bind-key -n User31 split-window -v -c "#{pane_current_path}"

bind-key -n User40 select-pane -L
bind-key -n User41 select-pane -R
bind-key -n User42 select-pane -U
bind-key -n User43 select-pane -D

bind-key -n User50 resize-pane -Z
bind-key -n User60 command-prompt -I "#W" "rename-window '%%'"
bind-key -n User70 send-keys -R \; clear-history

# --- Keep default prefix as fallback ---------------------------------------
# Cmd map covers daily use, but C-b still works if iTerm not mapped (e.g.
# attaching from another terminal emulator).
